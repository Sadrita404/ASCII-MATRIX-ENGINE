<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII MATRIX ENGINE </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Plus+Jakarta+Sans:ital,wght@0,700;1,700&display=swap');

        :root {
            --ink: #0d0d0d;
            --panel: #1616161;
            --rised: #1f1f1f;
            --sunken: #0a0a0a;
            --chrome: #2a2a2a;
            --rim: #3a3a3a;
            --hot: #e8ff00;
            --hot-dim: #b3c400;
            --red: #ff2200;
            --red-dim: #991500;
            --green: #00ff88;
            --green-dim: #00994d;
            --white: #f5f5f0;
            --muted: #606060;
            --screw: #252525;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--ink);
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
        }

        .machine-header {
            width: 100%;
            max-width: 1600px;
            background: var(--panel);
            border: 3px solid var(--rim);
            border-bottom: 6px solid var(--chrome);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            margin-bottom: 16px;
            position: relative;
        }

        .machine-header::before,
        .machine-header::after {
            content: '+';
            position: absolute;
            color: var(--muted);
            font-size: 10px;
        }
        .machine-header::before { top: 4px; left: 6px; }
        .machine-header::after { top: 4px; right: 6px; }

        .header-title {
            font-family: 'Bebas Neue' , sans-serif;
            font-size: 2rem;
            letter-spacing: 6px;
            color: var(--hot);
            text-shadow: 0 0 8px rgba(232,255,0,0.4);
        }

        .header-badge {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
            border: 1px solid #000;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .led.active { background: var(--green); box-shadow: 0 0 6px var(--green), inset 0 1px 0 rgba(255,255,255,0.2); }
        .led.warn { background: var(--hot); box-shadow: 0 0 6px var(--hot); }
        .led.danger { background: var(--red); box-shadow: 0 0 6px var(--red); }

        .header-label {
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
            width: 100%;
            max-width: 1600px;
            height: calc(100vh - 130px);
            min-height: 700px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: auto;
            padding-right: 4px;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: var(--ink); }
        .sidebar::-webkit-scrollbar-thumb { background: var(--rim); }

        .panel-block {
            background: var(--panel);
            border: 2px solid var(--rim);
            border-bottom: 4px solid var(--chrome);
            position: relative;
        }

        .panel-block::before,
        .panel-block::after,
        .panel-block .corner-tr,
        .panel-block .corner-bl {
            content: '🔵';
            position: absolute;
            font-size: 5px;
            color: var(--screw);
            width: 8px;
            height: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--chrome);
            border: 1px solid #000;
            border-radius: 50%;
        }
        .panel-block::before { top: 5px; left: 5px; }
        .panel-block::after { top: 5px; right: 5px; }

        .panel-inner {
            padding: 28px 14px 14px;
        }

        .panel-label {
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hot);
            color: #000;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 2px 10px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-main {
            width: 100%;
            background: var(--hot);
            color: #000;
            border: none;
            border-bottom: 5px solid var(--hot-dim);
            border-right: 3px solid var(--hot-dim);
            padding: 14px 20px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 4px;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.05s;
            position: relative;
            top: 0;
        }
        
        .btn-main:active {
            top: 3px;
            border-bottom: 2px solid var(--hot-dim);
        }

        .btn-main.halt {
            background: var(--red);
            border-bottom-color: var(--red-dim);
            border-right-color: var(--red-dim);
            color: #fff;
        }

        .btn-main.halt:active {
            top: 3px;
            border-bottom: 2px solid var(--red-dim);
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-name {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .slider-val {
            background: var(--sunken);
            border: 1px solid var(--rim);
            border-top: 1px solid #000;
            color: var(--hot);
            font-size: 0.7rem;
            padding: 2px 7px;
            font-family: 'Share Tech Mono', monospace;
            min-width: 52px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: var(--sunken);
            border: 1px solid #000;
            border-top: 1px solid var(--rim);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 26px;
            background: var(--chrome);
            border: 2px solid var(--rim);
            border-top: 2px solid #555;
            border-bottom: 3px solid #000;
            cursor: pointer;
            position: relative;
        }

        input[type="range"]::-webkit-slider-thumb::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 12px;
            background: var(--hot);
            transform: translate(-50%, -50%);
        }

        select, input[type="text"] {
            background: var(--sunken);
            border: 1px solid #000;
            border-top: 1px solid var(--rim);
            color: var(--white);
            padding: 8px 10px;
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            width: 100%;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

</style>
</head>

<body>

<h1>ASCII CAMERA V2</h1>

<div class="layout">

<div class="panel">

<button id="toggle">START</button>

<label>Resolution</label>
<input type="range" id="width" min="60" max="200" value="120">

<label>Brightness</label>
<input type="range" id="brightness" min="-100" max="100" value="0">

<label>
<input type="checkbox" id="mirror" checked>
Mirror
</label>

</div>

<div class="viewer">
<pre id="ascii"></pre>
</div>

</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const ascii=document.getElementById('ascii');

const toggle=document.getElementById('toggle');
const widthSlider=document.getElementById('width');
const brightnessSlider=document.getElementById('brightness');
const mirror=document.getElementById('mirror');

const chars='@#S%?*+;:,. ';

let streaming=false;
let stream=null;

toggle.onclick=()=>{

streaming?stop():start();

};

async function start(){

stream=await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject=stream;

video.onloadedmetadata=()=>{
video.play();
streaming=true;
toggle.textContent='STOP';
render();
};

}

function stop(){

stream.getTracks().forEach(t=>t.stop());

streaming=false;

toggle.textContent='START';

ascii.textContent='';

}

function render(){

if(!streaming)return;

const cols=parseInt(widthSlider.value);

const rows=Math.floor(cols*0.55);

canvas.width=cols;
canvas.height=rows;

ctx.drawImage(video,0,0,cols,rows);

const data=ctx.getImageData(0,0,cols,rows).data;

let text='';

for(let y=0;y<rows;y++){

for(let x=0;x<cols;x++){

const i=(y*cols+x)*4;

let r=data[i];
let g=data[i+1];
let b=data[i+2];

const bright=parseInt(brightnessSlider.value);

r+=bright;
g+=bright;
b+=bright;

const lum=(r+g+b)/3;

const index=Math.floor((lum/255)*(chars.length-1));

text+=chars[index];

}

text+='\n';

}

ascii.textContent=text;

ascii.classList.toggle('mirror',mirror.checked);

requestAnimationFrame(render);

}
</script>

</body>
</html>
