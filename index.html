<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII CAMERA V2</title>

<style>
body{
    margin:0;
    background:#0d1117;
    color:#fff;
    font-family:monospace;
    padding:20px;
}

h1{
    text-align:center;
    letter-spacing:4px;
    color:#00ff88;
}

.layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    height:90vh;
}

.panel{
    background:#161b22;
    border:2px solid #222;
    padding:20px;
}

.viewer{
    background:#050505;
    border:2px solid #222;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    width:100%;
    padding:14px;
    background:#00ff88;
    border:none;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:10px;
}

input[type="range"]{
    width:100%;
}

pre{
    font-size:8px;
    line-height:5px;
}

video,canvas{
    display:none;
}

.mirror{
    transform:scaleX(-1);
}
</style>
</head>

<body>

<h1>ASCII CAMERA V2</h1>

<div class="layout">

<div class="panel">

<button id="toggle">START</button>

<label>Resolution</label>
<input type="range" id="width" min="60" max="200" value="120">

<label>Brightness</label>
<input type="range" id="brightness" min="-100" max="100" value="0">

<label>
<input type="checkbox" id="mirror" checked>
Mirror
</label>

</div>

<div class="viewer">
<pre id="ascii"></pre>
</div>

</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const ascii=document.getElementById('ascii');

const toggle=document.getElementById('toggle');
const widthSlider=document.getElementById('width');
const brightnessSlider=document.getElementById('brightness');
const mirror=document.getElementById('mirror');

const chars='@#S%?*+;:,. ';

let streaming=false;
let stream=null;

toggle.onclick=()=>{

streaming?stop():start();

};

async function start(){

stream=await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject=stream;

video.onloadedmetadata=()=>{
video.play();
streaming=true;
toggle.textContent='STOP';
render();
};

}

function stop(){

stream.getTracks().forEach(t=>t.stop());

streaming=false;

toggle.textContent='START';

ascii.textContent='';

}

function render(){

if(!streaming)return;

const cols=parseInt(widthSlider.value);

const rows=Math.floor(cols*0.55);

canvas.width=cols;
canvas.height=rows;

ctx.drawImage(video,0,0,cols,rows);

const data=ctx.getImageData(0,0,cols,rows).data;

let text='';

for(let y=0;y<rows;y++){

for(let x=0;x<cols;x++){

const i=(y*cols+x)*4;

let r=data[i];
let g=data[i+1];
let b=data[i+2];

const bright=parseInt(brightnessSlider.value);

r+=bright;
g+=bright;
b+=bright;

const lum=(r+g+b)/3;

const index=Math.floor((lum/255)*(chars.length-1));

text+=chars[index];

}

text+='\n';

}

ascii.textContent=text;

ascii.classList.toggle('mirror',mirror.checked);

requestAnimationFrame(render);

}
</script>

</body>
</html>
