<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII MATRIX ENGINE </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Plus+Jakarta+Sans:ital,wght@0,700;1,700&display=swap');

        :root {
            --ink: #0d0d0d;
            --panel: #1616161;
            --rised: #1f1f1f;
            --sunken: #0a0a0a;
            --chrome: #2a2a2a;
            --rim: #3a3a3a;
            --hot: #e8ff00;
            --hot-dim: #b3c400;
            --red: #ff2200;
            --red-dim: #991500;
            --green: #00ff88;
            --green-dim: #00994d;
            --white: #f5f5f0;
            --muted: #606060;
            --screw: #252525;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--ink);
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
        }


</style>
</head>

<body>

<h1>ASCII CAMERA V2</h1>

<div class="layout">

<div class="panel">

<button id="toggle">START</button>

<label>Resolution</label>
<input type="range" id="width" min="60" max="200" value="120">

<label>Brightness</label>
<input type="range" id="brightness" min="-100" max="100" value="0">

<label>
<input type="checkbox" id="mirror" checked>
Mirror
</label>

</div>

<div class="viewer">
<pre id="ascii"></pre>
</div>

</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const ascii=document.getElementById('ascii');

const toggle=document.getElementById('toggle');
const widthSlider=document.getElementById('width');
const brightnessSlider=document.getElementById('brightness');
const mirror=document.getElementById('mirror');

const chars='@#S%?*+;:,. ';

let streaming=false;
let stream=null;

toggle.onclick=()=>{

streaming?stop():start();

};

async function start(){

stream=await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject=stream;

video.onloadedmetadata=()=>{
video.play();
streaming=true;
toggle.textContent='STOP';
render();
};

}

function stop(){

stream.getTracks().forEach(t=>t.stop());

streaming=false;

toggle.textContent='START';

ascii.textContent='';

}

function render(){

if(!streaming)return;

const cols=parseInt(widthSlider.value);

const rows=Math.floor(cols*0.55);

canvas.width=cols;
canvas.height=rows;

ctx.drawImage(video,0,0,cols,rows);

const data=ctx.getImageData(0,0,cols,rows).data;

let text='';

for(let y=0;y<rows;y++){

for(let x=0;x<cols;x++){

const i=(y*cols+x)*4;

let r=data[i];
let g=data[i+1];
let b=data[i+2];

const bright=parseInt(brightnessSlider.value);

r+=bright;
g+=bright;
b+=bright;

const lum=(r+g+b)/3;

const index=Math.floor((lum/255)*(chars.length-1));

text+=chars[index];

}

text+='\n';

}

ascii.textContent=text;

ascii.classList.toggle('mirror',mirror.checked);

requestAnimationFrame(render);

}
</script>

</body>
</html>
